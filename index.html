<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SeismoWatch — Live Earthquake Tracker</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<style>
body { margin:0; background:#0a0c10; color:#c8d0e0; font-family:monospace; }
#map { height:100vh; }

.controls {
  position:absolute; top:10px; left:10px;
  background:#111; padding:10px; border-radius:6px;
  z-index:1000;
}

select, button {
  margin:4px 0;
}
</style>
</head>

<body>

<div class="controls">
  <div>
    <label>Source:</label><br/>
    <select id="data-source">
      <option value="usgs">USGS (Global)</option>
      <option value="phivolcs">PHIVOLCS (Philippines)</option>
    </select>
  </div>

  <button id="refresh">Refresh</button>
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>
// =============================
// CONFIG
// =============================
const USGS_URL = 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson';
const PHIVOLCS_URL = 'https://earthquake.phivolcs.dost.gov.ph/feeds/quake/latest.json';

let currentSource = 'usgs';
let allQuakes = [];
let markers = {};

// =============================
// MAP INIT
// =============================
const map = L.map('map').setView([10, 125], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18
}).addTo(map);

// =============================
// FETCH
// =============================
async function fetchQuakes() {
  try {
    let data;

    if (currentSource === 'usgs') {
      const res = await fetch(USGS_URL);
      data = await res.json();
      allQuakes = data.features;
    }

    if (currentSource === 'phivolcs') {
      const res = await fetch(PHIVOLCS_URL);
      const json = await res.json();

      allQuakes = json.features.map((q, i) => ({
        id: q.id || `ph-${i}`,
        properties: {
          mag: q.properties.mag,
          place: q.properties.place,
          time: new Date(q.properties.time).getTime()
        },
        geometry: {
          coordinates: [
            q.geometry.coordinates[0],
            q.geometry.coordinates[1],
            q.geometry.coordinates[2] || 0
          ]
        }
      }));
    }

    render();

  } catch (e) {
    console.error(e);

    if (currentSource === 'phivolcs') {
      currentSource = 'usgs';
      document.getElementById('data-source').value = 'usgs';
      fetchQuakes();
    }
  }
}

// =============================
// RENDER
// =============================
function render() {

  // remove old markers
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  allQuakes.forEach(q => {
    const coords = q.geometry.coordinates;
    const lat = coords[1];
    const lng = coords[0];

    const mag = q.properties.mag || 0;

    const marker = L.circleMarker([lat, lng], {
      radius: 5 + mag * 2,
      color: mag > 5 ? 'red' : 'cyan'
    });

    marker.bindPopup(`
      <b>M ${mag}</b><br/>
      ${q.properties.place}<br/>
      ${new Date(q.properties.time).toLocaleString()}
    `);

    marker.addTo(map);
    markers[q.id] = marker;
  });
}

// =============================
// EVENTS
// =============================
document.getElementById('refresh').onclick = fetchQuakes;

document.getElementById('data-source').addEventListener('change', (e) => {
  currentSource = e.target.value;
  fetchQuakes();
});

// =============================
// INIT
// =============================
fetchQuakes();

</script>

</body>
</html>
